[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raccoon-evaluator"
version = "0.1.0"
description = "Config-driven evaluation engine for open-ended coding assignments"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
model = ["openai>=1.40"]
dev = ["pytest>=8", "jsonschema>=4.18"]

[project.scripts]
evaluator = "evaluator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
