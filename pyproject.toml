[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raccoon-evaluator"
version = "0.1.0"
description = "Config-driven evaluation engine for open-ended coding assignments"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18", "python-dotenv>=1.0", "rich>=13.9"]

[project.optional-dependencies]
model = ["openai>=2.8"]
dev = ["pytest>=8"]

[project.scripts]
evaluator = "evaluator.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["evaluator", "evaluator.*", "contracts.schemas"]

[tool.setuptools.package-data]
evaluator = ["assets/*.txt"]
"contracts.schemas" = ["*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
